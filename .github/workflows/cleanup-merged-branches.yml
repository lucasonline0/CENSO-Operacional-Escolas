name: Cleanup merged branches

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/cleanup-merged-branches.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches fully merged into develop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          mapfile -t OPEN_PR_HEADS < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 200 \
              --json headRefName \
              --jq '.[].headRefName'
          )

          is_open_pr_head() {
            local candidate="$1"
            local head
            for head in "${OPEN_PR_HEADS[@]:-}"; do
              if [[ "$candidate" == "$head" ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          skipped_open=0

          while IFS= read -r ref; do
            branch="${ref#origin/}"

            case "$branch" in
              HEAD|main|develop) continue ;;
            esac

            if is_open_pr_head "$branch"; then
              echo "KEEP open PR: $branch"
              skipped_open=$((skipped_open + 1))
              continue
            fi

            echo "DELETE merged: $branch"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done < <(
            git for-each-ref \
              --format='%(refname:short)' \
              --merged=origin/develop \
              refs/remotes/origin/
          )

          echo "Deleted branches: $deleted"
          echo "Skipped open PR heads: $skipped_open"
