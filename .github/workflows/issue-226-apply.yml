name: Issue 226 apply and validate

on:
  push:
    branches:
      - fix/dre-canonical-scope-all-endpoints

permissions:
  contents: write

concurrency:
  group: issue-226-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: censo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d censo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/censo_test?sslmode=disable
      ADMIN_JWT_SECRET: dre-226-validation-secret-0123456789-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Fix deterministic patch metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/issue226_patch.py')
          s = p.read_text()

          old = '''# Both direct-list callers use the standard 7 filters; f.Args adds DREID.
          rep(p,
              "\\t\\tf.Year, f.DRE, f.Municipio, f.Zona, f.RegiaoIntegracao, f.SchoolID, f.CodigoINEP)",
              "\\t\\tf.Args()...)",
              expected=2)'''
          new = '''# The file has three direct school-list callers using the standard filters.
          rep(p,
              "\\t\\tf.Year, f.DRE, f.Municipio, f.Zona, f.RegiaoIntegracao, f.SchoolID, f.CodigoINEP)",
              "\\t\\tf.Args()...)",
              expected=3)'''
          if old not in s:
              raise SystemExit('direct-list patch metadata block not found')
          s = s.replace(old, new)

          old2 = '''rep(p,
              "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP,",
              "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP, filters.DREID,",
              expected=1)'''
          new2 = '''rep(p,
              "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP)",
              "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP, filters.DREID)",
              expected=1)'''
          if old2 not in s:
              raise SystemExit('governance caller patch metadata block not found')
          s = s.replace(old2, new2)

          old3 = '''rep(p, "const governancaInstitucionalWhereSQL = `", "var governancaInstitucionalWhereSQL = `")
          rep(p,
              "\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",
              "\\tWHERE ($1 = '' OR ` + analyticsDREPredicate(\\"school_id\\", \\"dre\\", \\"$1\\") + `)",
              expected=1)
          rep(p, "const governancaInstitucionalScopedWhereSQL = `", "var governancaInstitucionalScopedWhereSQL = `")
          rep(p,
              "\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",
              "\\tWHERE ` + analyticsDREScopedFilterPredicate(\\"school_id\\", \\"dre\\", \\"$7\\", \\"$1\\") + `",
              expected=1)'''
          new3 = '''rep(p,
              "const governancaInstitucionalWhereSQL = `\\n\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",
              "var governancaInstitucionalWhereSQL = `\\n\\tWHERE ($1 = '' OR ` + analyticsDREPredicate(\\"school_id\\", \\"dre\\", \\"$1\\") + `)",
              expected=1)
          rep(p,
              "const governancaInstitucionalScopedWhereSQL = `\\n\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",
              "var governancaInstitucionalScopedWhereSQL = `\\n\\tWHERE ` + analyticsDREScopedFilterPredicate(\\"school_id\\", \\"dre\\", \\"$7\\", \\"$1\\") + `",
              expected=1)'''
          if old3 not in s:
              raise SystemExit('governance where patch block not found')
          s = s.replace(old3, new3)

          old4 = '''rep(p,
              "\\t\\t\\tv.dre,\\n\\t\\t\\tCOUNT(DISTINCT v.school_id)::bigint,",
              "\\t\\t\\t`+analyticsDRENameExpr(\\"v.school_id\\", \\"v.dre\\")+` AS dre,\\n\\t\\t\\tCOUNT(DISTINCT v.school_id)::bigint,",
              expected=1)'''
          new4 = '''rep(p,
              "\\t\\t\\tv.dre,\\n",
              "\\t\\t\\t`+analyticsDRENameExpr(\\"v.school_id\\", \\"v.dre\\")+` AS dre,\\n",
              expected=1)'''
          if old4 not in s:
              raise SystemExit('pessoal por-DRE projection patch block not found')
          s = s.replace(old4, new4)

          p.write_text(s)
          PY

      - name: Apply deterministic patch
        run: python3 tools/issue226_patch.py

      - name: Format Go
        run: gofmt -w api/cmd/api

      - name: Verify no raw DRE authorization remains in active issue-226 paths
        shell: bash
        run: |
          set -euo pipefail
          files=(
            api/cmd/api/analytics.go
            api/cmd/api/analytics_filtros.go
            api/cmd/api/analytics_infra_merenda_servicos.go
            api/cmd/api/analytics_indice_governanca.go
            api/cmd/api/analytics_governanca_institucional.go
            api/cmd/api/analytics_saude_operacional.go
            api/cmd/api/analytics_perfil_alunos_ideb.go
            api/cmd/api/analytics_financeiro_governanca.go
            api/cmd/api/analytics_pessoal_tecnologia.go
            api/cmd/api/reports.go
            api/cmd/api/reports_infraestrutura.go
            api/cmd/api/reports_merenda.go
            api/cmd/api/reports_financeiro_governanca.go
            api/cmd/api/reports_saude_operacional.go
          )
          if grep -nE "WHERE .*UPPER\(TRIM\(s\.dre\)\).*UPPER\(TRIM\(\$[0-9]+\)\)|AND \(\$[0-9]+ = '' OR [a-zA-Z_]+\.dre = \$[0-9]+\)|AND .*UPPER\(TRIM\(scope_s\.dre\)" "${files[@]}"; then
            echo 'raw textual DRE authorization remains in an active path'
            exit 1
          fi

      - name: Initialize integration schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/init.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/cmd/api/migrations/0014_reg_integracao.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/cmd/api/migrations/0018_create_admin_users.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/cmd/api/migrations/0019_create_dres_master.sql

      - name: Targeted P0 regression tests
        working-directory: api
        run: go test ./cmd/api -run '^(TestDRECanonicalScopedPredicateIgnoresForgedLegacyTextAndLongName|TestIssue226ActiveSQLCarriesDREID|TestDREIDScopeCanonicalIgnoresStaleLegacyText|TestDREIDScopeRemapChangesScopeByID)$' -count=1

      - name: Vet
        working-directory: api
        run: go vet ./...

      - name: Full Go suite
        working-directory: api
        run: go test ./... -count=1

      - name: Remove temporary implementation helpers
        run: |
          rm -f tools/issue226_patch.py
          rm -f .github/issue226-trigger
          rm -f .github/workflows/issue-226-audit.yml
          rm -f .github/workflows/issue-226-apply.yml

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Lucas Madureira"
          git config user.email "129661036+lucasonline0@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: complete canonical DRE scope across analytics and reports"
          git push origin HEAD:fix/dre-canonical-scope-all-endpoints
