name: Issue 226 diagnostic

on:
  push:
    branches:
      - fix/dre-canonical-scope-all-endpoints

permissions:
  contents: read

concurrency:
  group: issue-226-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: censo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d censo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/censo_test?sslmode=disable
      ADMIN_JWT_SECRET: dre-226-validation-secret-0123456789-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Fix deterministic patch metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/issue226_patch.py')
          s = p.read_text()

          s = s.replace('''# Both direct-list callers use the standard 7 filters; f.Args adds DREID.\nrep(p,\n    "\\t\\tf.Year, f.DRE, f.Municipio, f.Zona, f.RegiaoIntegracao, f.SchoolID, f.CodigoINEP)",\n    "\\t\\tf.Args()...)",\n    expected=2)''', '''# The file has three direct school-list callers using the standard filters.\nrep(p,\n    "\\t\\tf.Year, f.DRE, f.Municipio, f.Zona, f.RegiaoIntegracao, f.SchoolID, f.CodigoINEP)",\n    "\\t\\tf.Args()...)",\n    expected=3)''')

          s = s.replace('''rep(p,\n    "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP,",\n    "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP, filters.DREID,",\n    expected=1)''', '''rep(p,\n    "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP)",\n    "\\t\\tfilters.DRE, filters.Municipio, filters.Zona, filters.RegiaoIntegracao, filters.SchoolID, filters.CodigoINEP, filters.DREID)",\n    expected=1)''')

          s = s.replace('''rep(p, "const governancaInstitucionalWhereSQL = `", "var governancaInstitucionalWhereSQL = `")\nrep(p,\n    "\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",\n    "\\tWHERE ($1 = '' OR ` + analyticsDREPredicate(\\"school_id\\", \\"dre\\", \\"$1\\") + `)",\n    expected=1)\nrep(p, "const governancaInstitucionalScopedWhereSQL = `", "var governancaInstitucionalScopedWhereSQL = `")\nrep(p,\n    "\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",\n    "\\tWHERE ` + analyticsDREScopedFilterPredicate(\\"school_id\\", \\"dre\\", \\"$7\\", \\"$1\\") + `",\n    expected=1)''', '''rep(p,\n    "const governancaInstitucionalWhereSQL = `\\n\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",\n    "var governancaInstitucionalWhereSQL = `\\n\\tWHERE ($1 = '' OR ` + analyticsDREPredicate(\\"school_id\\", \\"dre\\", \\"$1\\") + `)",\n    expected=1)\nrep(p,\n    "const governancaInstitucionalScopedWhereSQL = `\\n\\tWHERE ($1 = '' OR UPPER(TRIM(dre)) = UPPER(TRIM($1)))",\n    "var governancaInstitucionalScopedWhereSQL = `\\n\\tWHERE ` + analyticsDREScopedFilterPredicate(\\"school_id\\", \\"dre\\", \\"$7\\", \\"$1\\") + `",\n    expected=1)''')

          s = s.replace('''rep(p,\n    "\\t\\t\\tv.dre,\\n\\t\\t\\tCOUNT(DISTINCT v.school_id)::bigint,",\n    "\\t\\t\\t`+analyticsDRENameExpr(\\"v.school_id\\", \\"v.dre\\")+` AS dre,\\n\\t\\t\\tCOUNT(DISTINCT v.school_id)::bigint,",\n    expected=1)''', '''rep(p,\n    "\\t\\t\\tv.dre,\\n",\n    "\\t\\t\\t`+analyticsDRENameExpr(\\"v.school_id\\", \\"v.dre\\")+` AS dre,\\n",\n    expected=1)''')

          p.write_text(s)
          PY

      - name: Apply deterministic patch
        run: python3 tools/issue226_patch.py

      - name: Format Go
        run: gofmt -w api/cmd/api

      - name: Initialize integration schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/init.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/cmd/api/migrations/0014_reg_integracao.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/cmd/api/migrations/0018_create_admin_users.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/cmd/api/migrations/0019_create_dres_master.sql

      - name: Full Go suite with captured output
        id: full_tests
        working-directory: api
        shell: bash
        run: |
          set -o pipefail
          go test ./... -count=1 2>&1 | tee ../issue226-full-go-test.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue226-full-go-test
          path: issue226-full-go-test.log
          if-no-files-found: error
