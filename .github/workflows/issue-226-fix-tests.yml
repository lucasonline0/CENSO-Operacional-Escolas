name: Issue 226 fix stale tests

on:
  push:
    branches:
      - fix/dre-canonical-scope-all-endpoints

permissions:
  contents: write

concurrency:
  group: issue-226-fix-tests
  cancel-in-progress: true

jobs:
  fix-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Align stale tests with canonical dre_id contract
        run: |
          python3 tools/issue226_fix_tests.py
          gofmt -w api/cmd/api/advanced_dre_scope_test.go api/cmd/api/analytics_filtros_test.go api/cmd/api/analytics_perfil_alunos_ideb_test.go api/cmd/api/analytics_saude_operacional_test.go api/cmd/api/reports_infraestrutura_test.go api/cmd/api/reports_test.go

      - name: Remove temporary migration helpers and push
        run: |
          rm -f .github/workflows/issue-226-fix-tests.yml tools/issue226_fix_tests.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/cmd/api .github/workflows/issue-226-fix-tests.yml tools/issue226_fix_tests.py
          git commit -m "test: align issue 226 assertions with canonical DRE scope"
          git push origin HEAD:fix/dre-canonical-scope-all-endpoints
