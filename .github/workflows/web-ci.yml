name: Web CI

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Gate de contrato do frontend: mudanças só de web/ precisam passar por
# lint + build (Next.js). Determinstico: npm ci a partir do lockfile e Node
# fixo; nenhum estado externo é necessário (as chamadas à API usam fallback
# local em runtime, não no build).
jobs:
  build-lint:
    name: Web build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
